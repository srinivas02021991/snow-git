name: snowflake-devops-demo1

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
  workflow_dispatch:

jobs:
  deploy-snowflake-changes-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Use Python 3.8.x
        uses: actions/setup-python@v2.2.1
        with:
          python-version: 3.8.x

      - name: Run schemachange
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          echo "Step 1: Installing schemachange"
          pip install schemachange

          echo "Step 2: Running schemachange"
          schemachange -f $GITHUB_WORKSPACE/deploy \
            -a $SF_ACCOUNT \
            -u $SF_USERNAME \
            -r $SF_ROLE \
            -w $SF_WAREHOUSE \
            -d $SF_DATABASE \
            -c $SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY \
            --create-change-history-table

      - name: Install dbt and dependencies
        run: |
          echo "Step 3: Installing dbt-core and dbt-snowflake"
          pip install dbt-core dbt-snowflake

            - name: Run dbt models
        env:
          DBT_USER: ${{ secrets.SF_USERNAME }}
          DBT_PASSWORD: ${{ secrets.SF_PASSWORD }}
          DBT_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          DBT_ROLE: ${{ secrets.SF_ROLE }}
          DBT_DATABASE: ${{ secrets.SF_DATABASE }}
          DBT_SCHEMA: MY_SCHEMA  # Replace with your schema name
          DBT_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
        run: |
          echo "Step 4: Creating dbt profile"
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOL
          dbt_project:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: $DBT_ACCOUNT
                user: $DBT_USER
                password: $DBT_PASSWORD
                role: $DBT_ROLE
                database: $DBT_DATABASE
                schema: $DBT_SCHEMA
                warehouse: $DBT_WAREHOUSE
                threads: 4
                client_session_keep_alive: False
          EOL

          echo "Step 5: Running dbt"
          cd $GITHUB_WORKSPACE/dbt/practice_dbt_proj  # <--- Update this to match your GitHub folder structure
          dbt deps
          dbt debug
          dbt run

